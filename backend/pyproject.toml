[tool.poetry]
name = "fitai-backend"
version = "0.1.0"
description = "FitAI Coach — personal nutrition and fitness tracking backend"
authors = ["Yu-Chieh <yuchiehchou30@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.0"
langfuse = "^2.0.0"
anthropic = "^0.40.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pgvector = "^0.3.0"
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
